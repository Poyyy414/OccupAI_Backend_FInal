<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OccupAI - Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f4f7fb; background: #06100c; font-family: Arial, sans-serif; }
    .card { width: min(100%, 440px); padding: 32px; border: 1px solid rgba(50,230,173,.22); border-radius: 18px; background: #0d1b15; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
    .logo { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #000; }
    .brand-name { font-size: 20px; font-weight: 800; }
    .brand-meta { margin-top: 3px; color: #91a69e; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { margin: 0 0 24px; color: #9aaea6; line-height: 1.55; }
    label { display: block; margin-bottom: 8px; color: #32e6ad; font-size: 12px; font-weight: 700; }
    .field { margin-bottom: 16px; }
    input { width: 100%; padding: 14px; border: 1px solid #2b443a; border-radius: 10px; outline: 0; color: #f4f7fb; background: #07130f; }
    input:focus { border-color: #32e6ad; }
    button { width: 100%; margin-top: 4px; padding: 14px; border: 0; border-radius: 10px; color: #06110d; background: #32e6ad; font-weight: 800; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    .message { display: none; margin-top: 18px; padding: 12px; border-radius: 10px; color: #bdf8df; background: rgba(50,230,173,.1); line-height: 1.45; }
    .message.error { color: #ffc0cc; background: rgba(255,92,122,.1); }
    .back { display: inline-block; margin-top: 22px; color: #32e6ad; font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img class="logo" src="/static/occupai_logo.png" alt="OccupAI logo" />
      <div><div class="brand-name">OccupAI</div><div class="brand-meta">Parking Ops</div></div>
    </div>
    <h1>Choose a new password</h1>
    <p>Your reset link is single-use. Use at least 8 characters with a letter and a number.</p>
    <form id="resetForm">
      <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" required /></div>
      <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" required /></div>
      <button id="submitButton" type="submit">Update password</button>
    </form>
    <div class="message" id="message" role="status"></div>
    <a class="back" href="/login">Back to sign in</a>
  </main>
  <script nonce="__OCCUPAI_CSP_NONCE__">
    const form = document.getElementById('resetForm');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');
    const token = new URLSearchParams(window.location.search).get('token') || '';
    function showMessage(text, isError) {
      message.textContent = text;
      message.classList.toggle('error', isError);
      message.style.display = 'block';
    }
    if (!token) {
      button.disabled = true;
      showMessage('This reset link is missing or invalid.', true);
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) { showMessage('Passwords do not match.', true); return; }
      button.disabled = true;
      try {
        const response = await fetch('/auth/reset-password', {
          method: 'POST', credentials: 'include',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token, password})
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || data.message || 'Unable to reset password.');
        showMessage(data.message || 'Password updated. You can now sign in.', false);
        form.reset();
      } catch (error) {
        showMessage(error.message || 'Unable to reset password.', true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
