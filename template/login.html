<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OccupAI - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    :root {
      --bg: #05080c;
      --glass: rgba(12, 15, 18, .62);
      --glass-2: rgba(255, 255, 255, .075);
      --border: rgba(255, 255, 255, .18);
      --line: rgba(255, 255, 255, .10);
      --text: #f6f9fb;
      --muted: #b4bfcb;
      --muted-2: #7f8c99;
      --green: #45dfad;
      --green-2: #8bf2cb;
      --blue: #66a9ff;
      --radius: 8px;
    }

    html { color-scheme: dark; scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
      background: var(--bg);
      opacity: 1;
      transition: opacity .32s ease;
    }

    body.page-leaving { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      body, .reveal { transition: none !important; animation: none !important; }
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(5, 8, 12, .78) 0%, rgba(5, 8, 12, .34) 45%, rgba(5, 8, 12, .78) 100%),
        linear-gradient(180deg, rgba(5, 8, 12, .18), rgba(5, 8, 12, .92)),
        url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2200&q=80");
      background-size: cover;
      background-position: center;
      transform: scale(1.02);
      filter: saturate(.84) contrast(1.04);
      z-index: -3;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(180deg, transparent, black 14%, black 82%, transparent);
      z-index: -2;
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    .mono { font-family: "Space Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(18px, 3vw, 34px);
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      position: relative;
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: #06110d;
      font-family: "Space Mono", monospace;
      font-weight: 800;
      box-shadow: 0 14px 35px rgba(69, 223, 173, .26);
    }

    .brand-name { font-size: 20px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .brand-meta { margin-top: 2px; color: rgba(246, 249, 251, .68); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; }

    .hero {
      position: relative;
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: min(720px, calc(100vh - 180px));
      padding: 24px 0;
    }

    .headline {
      width: min(860px, 100%);
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: var(--green);
      font-family: "Space Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .18em;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(940px, 100%);
      min-height: 310px;
    }

    /* Subtle reveal-on-load: content eases up into place instead of popping
       in — applied once via JS adding .in on DOMContentLoaded, staggered
       per element with --reveal-delay. */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .55s cubic-bezier(.16,.8,.3,1), transform .55s cubic-bezier(.16,.8,.3,1);
      transition-delay: var(--reveal-delay, 0s);
    }
    .reveal.in { opacity: 1; transform: none; }

    @keyframes cardGlowPulse {
      0%, 100% { opacity: .55; transform: scale(1); }
      50%      { opacity: .85; transform: scale(1.04); }
    }

    .stage::before {
      content: "";
      position: absolute;
      z-index: 2;
      width: min(440px, 90%);
      height: 320px;
      background: radial-gradient(closest-side, rgba(69,223,173,.16), transparent 72%);
      filter: blur(6px);
      pointer-events: none;
      animation: cardGlowPulse 6s ease-in-out infinite;
    }

    .auth-card {
      position: relative;
      z-index: 3;
      width: min(100%, 420px);
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.045)),
        var(--glass);
      box-shadow: 0 26px 80px rgba(0, 0, 0, .46), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(22px);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .auth-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 32px 90px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255,255,255,.1);
    }

    .auth-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(69,223,173,.18), transparent 32%, rgba(102,169,255,.12));
      opacity: .7;
    }

    .auth-card > * { position: relative; z-index: 1; }

    .card-title { text-align: center; font-size: 28px; line-height: 1.1; font-weight: 800; }
    .card-sub { margin-top: 8px; margin-bottom: 20px; text-align: center; color: var(--muted); font-size: 13px; }
    .card-sub a { color: var(--green); font-weight: 800; text-decoration: none; }
    .card-sub a:hover { text-decoration: underline; }

    .field { margin-bottom: 15px; }
    .field label {
      display: block;
      margin-bottom: 7px;
      color: rgba(246, 249, 251, .62);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .field input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--radius);
      outline: 0;
      background: rgba(5, 8, 12, .44);
      color: var(--text);
      font-size: 14px;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .field input:focus {
      border-color: rgba(69, 223, 173, .82);
      background: rgba(5, 8, 12, .62);
      box-shadow: 0 0 0 4px rgba(69, 223, 173, .12);
    }

    .field input::placeholder { color: rgba(180, 191, 203, .55); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--green), #93efce);
      color: #06110d;
      font-weight: 900;
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 35px rgba(69, 223, 173, .24); }
    .btn:disabled { cursor: wait; opacity: .72; transform: none; box-shadow: none; }

    .error-box {
      display: none;
      margin-bottom: 14px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 92, 122, .34);
      border-radius: var(--radius);
      background: rgba(255, 92, 122, .12);
      color: #ffb4c2;
      font-size: 13px;
      line-height: 1.45;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(6, 17, 13, .24);
      border-top-color: #06110d;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .lot-plate {
      position: absolute;
      z-index: 1;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--radius);
      background: rgba(12, 15, 18, .32);
      box-shadow: 0 26px 70px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
      pointer-events: none;
      left: 4%;
      top: 22%;
      width: 250px;
      height: 190px;
      transform: rotateX(58deg) rotateZ(-32deg);
      transform-style: preserve-3d;
    }

    .lot-plate::before, .lot-plate::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 4px;
      background:
        linear-gradient(90deg, transparent 0 10%, rgba(255,255,255,.2) 10% 11%, transparent 11% 20%, rgba(255,255,255,.2) 20% 21%, transparent 21% 30%, rgba(255,255,255,.2) 30% 31%, transparent 31% 40%, rgba(255,255,255,.2) 40% 41%, transparent 41% 100%),
        linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.03));
    }

    .lot-plate::after {
      inset: 56px 70px;
      border-color: rgba(69,223,173,.46);
      box-shadow: 0 0 28px rgba(69,223,173,.2);
    }

    @media (max-width: 860px) {
      .page { padding: 18px; }
      .hero { min-height: auto; align-content: start; padding-top: 28px; }
      .stage { min-height: auto; }
      .lot-plate { display: none; }
    }

    @media (max-width: 520px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .auth-card { padding: 22px; }
      .headline { text-align: left; justify-self: stretch; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <div class="brand-name">OccupAI</div>
          <div class="brand-meta">Parking Ops</div>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="headline">
        <div class="eyebrow reveal" style="--reveal-delay:.05s">105 Penafrancia Ave</div>
      </div>

      <div class="stage">
        <div class="lot-plate" aria-hidden="true"></div>

        <div class="auth-card reveal" style="--reveal-delay:.16s">
          <div class="card-title">Welcome back</div>
          <div class="card-sub">No account yet? <a href="/register">Create one</a></div>

          <div class="error-box" id="error-box"></div>

          <form id="loginForm">
            <div class="field">
              <label for="email">Email address</label>
              <input type="email" id="email" placeholder="you@email.com" autocomplete="email" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
            </div>

            <button class="btn" id="btn-login" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    function destinationForRole(role) {
      const normalized = String(role || 'driver').toLowerCase();
      return normalized === 'admin' ? '/dashboard' : '/driver';
    }

    function goTo(url) {
      // Fade out before navigating instead of an abrupt jump — skipped
      // entirely if the visitor has reduced-motion set.
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) { window.location.href = url; return; }
      document.body.classList.add('page-leaving');
      setTimeout(() => { window.location.href = url; }, 260);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.reveal').forEach(el => requestAnimationFrame(() => el.classList.add('in')));
    });

    (function () {
      try {
        const raw = localStorage.getItem('occupai_user');
        if (!raw || raw === 'undefined' || raw === 'null') {
          localStorage.removeItem('occupai_user');
          localStorage.removeItem('occupai_token');
          return;
        }
        const u = JSON.parse(raw);
        if (u && typeof u === 'object' && u.user_id && localStorage.getItem('occupai_token')) {
          goTo(destinationForRole(u.role));
        } else {
          localStorage.removeItem('occupai_user');
          localStorage.removeItem('occupai_token');
        }
      } catch (e) {
        localStorage.removeItem('occupai_user');
        localStorage.removeItem('occupai_token');
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', doLogin);

    async function doLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');

      showErr('');
      if (!email || !password) {
        showErr('Please fill in all fields.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || data.message || 'Login failed.');
        }
        if (!data.user_id) {
          throw new Error('Server returned an invalid response. Please try again.');
        }

        const userObj = {
          user_id: data.user_id,
          first_name: data.first_name || '',
          last_name: data.last_name || '',
          full_name: data.full_name || ((data.first_name || '') + ' ' + (data.last_name || '')).trim(),
          email: data.email || email,
          role: data.role || 'driver',
        };

        localStorage.setItem('occupai_user', JSON.stringify(userObj));
        if (data.token) localStorage.setItem('occupai_token', data.token);
        if (!localStorage.getItem('occupai_user')) {
          throw new Error('Could not save session. Check browser storage settings.');
        }

        btn.innerHTML = 'Redirecting...';
        setTimeout(() => { goTo(destinationForRole(userObj.role)); }, 100);
      } catch (e) {
        showErr(e.message);
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    function showErr(msg) {
      const box = document.getElementById('error-box');
      if (!msg) {
        box.style.display = 'none';
        box.textContent = '';
        return;
      }
      box.textContent = msg;
      box.style.display = 'block';
    }
  </script>
</body>
</html>
