name: Keep Render service warm

# Render's free tier spins a web service down after ~15 minutes with no
# incoming traffic, so the next real request pays a slow cold start. This
# pings a lightweight status endpoint every 10 minutes to keep it warm.
#
# NOTE: this only prevents idle spin-down. It does NOT fix out-of-memory
# crashes (Render killing the process for exceeding its RAM limit) — a
# crashed/OOM-killed instance won't be "woken up" by this, Render has to
# restart it on its own.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /status
        run: |
          url="https://occupai-backend-final-last.onrender.com/status"
          echo "Pinging $url"

          # Render's free tier can take 30-60s+ to wake a cold instance, so a
          # single short-timeout curl flakes on the exact scenario this job
          # exists to prevent. Retry a few times with a generous per-attempt
          # timeout before actually failing the job.
          attempt=1
          max_attempts=5
          code=000
          until [ "$attempt" -gt "$max_attempts" ]; do
            code=$(curl -s -o response.json -w "%{http_code}" --max-time 55 "$url" || echo 000)
            echo "Attempt $attempt: HTTP status $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

          cat response.json 2>/dev/null || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Ping failed with HTTP $code after $max_attempts attempts"
            exit 1
          fi
